<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Da tua Ritxi</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #1a1a1a;
    }

    header h1 em {
      font-style: italic;
      color: #b07d5b;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #b07d5b;
      margin: 20px auto 0;
    }

    /* ── MASONRY GRID ── */
    .gallery {
      column-count: 3;
      column-gap: 12px;
      padding: 20px 24px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 768px) { .gallery { column-count: 2; } }
    @media (max-width: 480px) { .gallery { column-count: 1; } }

    .item {
      break-inside: avoid;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .item img,
    .item video {
      width: 100%;
      display: block;
      transition: transform 0.4s ease;
    }

    .item:hover img,
    .item:hover video {
      transform: scale(1.03);
    }

    .item video {
      object-fit: cover;
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-icon svg { width: 20px; height: 20px; fill: #b07d5b; margin-left: 3px; }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .lightbox-inner img,
    .lightbox-inner video {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 4px;
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .lightbox-close:hover { opacity: 1; }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #aaa;
    }

    .empty p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .empty span { font-size: 0.85rem; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <header>
    <h1>Da tua <em>Ritxi</em></h1>
    <div class="divider"></div>
  </header>

  <div class="gallery" id="gallery">
    <!-- ADICIONA AS TUAS FOTOS E VÍDEOS AQUI -->
    <!-- Exemplo foto:
    <div class="item" onclick="openLightbox(0)">
      <img src="foto1.jpg" alt="" loading="lazy" />
    </div>
    -->
    <!-- Exemplo vídeo:
    <div class="item" onclick="openLightbox(1)">
      <video src="video1.mp4" muted playsinline preload="metadata"></video>
      <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    -->
  </div>

  <div class="empty" id="emptyState">
    <p>Em breve…</p>
    <span>as memórias chegam</span>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigate(-1)">‹</button>
    <div class="lightbox-inner" id="lightboxInner"></div>
    <button class="lightbox-nav lightbox-next" onclick="navigate(1)">›</button>
  </div>

  <script>
    let currentIndex = 0;
    const items = [];

    // Recolhe todos os itens da galeria
    document.querySelectorAll('.gallery .item').forEach((el, i) => {
      const img = el.querySelector('img');
      const vid = el.querySelector('video');
      if (img) items.push({ type: 'image', src: img.src });
      if (vid) items.push({ type: 'video', src: vid.src });
      el.onclick = () => openLightbox(i);
    });

    // Mostra/esconde empty state
    if (items.length > 0) {
      document.getElementById('emptyState').style.display = 'none';
    }

    function openLightbox(index) {
      if (items.length === 0) return;
      currentIndex = index;
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightboxInner').innerHTML = '';
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + items.length) % items.length;
      renderLightbox();
    }

    function renderLightbox() {
      const inner = document.getElementById('lightboxInner');
      const item = items[currentIndex];
      if (item.type === 'image') {
        inner.innerHTML = `<img src="${item.src}" />`;
      } else {
        inner.innerHTML = `<video src="${item.src}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:4px;display:block;"></video>`;
      }
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'ArrowLeft') navigate(-1);
    });
  </script>
</body>
</html>
