<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Da tua Ritxi</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #1a1a1a;
    }

    header h1 em {
      font-style: italic;
      color: #b07d5b;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #b07d5b;
      margin: 20px auto 0;
    }

    .gallery {
      column-count: 3;
      column-gap: 12px;
      padding: 20px 24px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 768px) { .gallery { column-count: 2; } }
    @media (max-width: 480px) { .gallery { column-count: 1; } }

    .item {
      break-inside: avoid;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .item img {
      width: 100%;
      display: block;
      transition: transform 0.4s ease;
    }

    .item:hover img {
      transform: scale(1.03);
    }

    .item iframe {
      width: 100%;
      display: block;
      border: none;
      border-radius: 4px;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .lightbox-inner img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 4px;
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .lightbox-close:hover { opacity: 1; }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>Da tua <em>Ritxi</em></h1>
    <div class="divider"></div>
  </header>

  <div class="gallery" id="gallery">

    <!-- VÍDEO DO DRIVE -->
    <div class="item">
      <iframe
        src="https://drive.google.com/file/d/1rYaRcolPuC6-5eZekEt9o7srqS-AOjtD/preview"
        width="100%"
        height="300"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>

    <!-- ADICIONA MAIS FOTOS AQUI -->
    <!-- Exemplo foto:
    <div class="item">
      <img src="foto1.jpg" alt="" loading="lazy" />
    </div>
    -->

  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigate(-1)">‹</button>
    <div class="lightbox-inner" id="lightboxInner"></div>
    <button class="lightbox-nav lightbox-next" onclick="navigate(1)">›</button>
  </div>

  <script>
    let currentIndex = 0;
    const items = [];

    document.querySelectorAll('.gallery .item img').forEach((el, i) => {
      items.push({ type: 'image', src: el.src });
      el.parentElement.onclick = () => openLightbox(i);
    });

    function openLightbox(index) {
      if (items.length === 0) return;
      currentIndex = index;
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightboxInner').innerHTML = '';
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + items.length) % items.length;
      renderLightbox();
    }

    function renderLightbox() {
      const inner = document.getElementById('lightboxInner');
      const item = items[currentIndex];
      inner.innerHTML = `<img src="${item.src}" />`;
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'ArrowLeft') navigate(-1);
    });
  </script>
</body>
</html>
